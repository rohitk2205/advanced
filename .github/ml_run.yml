name: ML Run on Docker with lib installed in docker
# on mentions a trigger for the workflow
on:
    #push: # when a push is made to the main branch of the repository
    workflow_dispatch: # runs on workflow dispatch
jobs:
  ml_run:
    runs-on: ubuntu-latest # runs the workflow on the latest ubuntu version
    container: 
      image: jupyter/scipy-notebook:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # uses the checkout action to checkout the code


      - name: List installed python packages
        run: 
          pip list


#      - name: Set up Python
#        uses: actions/setup-python@v6 # uses the setup-python action to set up the python environment
#        with:
#          python-version: '3.13'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run the script
        run:
          python ml_example.py

